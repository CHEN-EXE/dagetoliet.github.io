<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGJ.Service - 集团统一运维控制台</title>
    <style>
        :root {
            --primary-color: #1677ff; /* 大厂常用的科技蓝 */
            --primary-hover: #4096ff;
            --bg-color: #f5f7fa;      /* 干净的内网背景底色 */
            --card-bg: #ffffff;
            --text-main: #1f2329;     /* 字节/飞书风格的深色文本 */
            --text-muted: #646a73;
            --border-color: #dee0e3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 顶部微型导航条，营造内网系统氛围 */
        .internal-header {
            background: #ffffff;
            height: 48px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .header-logo {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #1f2329;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-logo::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
        }

        .header-tag {
            font-size: 11px;
            background: #edf5ff;
            color: var(--primary-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        /* 登录主体容器 */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(31, 35, 41, 0.04), 0 1px 2px rgba(31, 35, 41, 0.02);
            border: 1px solid rgba(31, 35, 41, 0.08);
        }

        .card-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            text-align: left;
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
            text-align: left;
        }

        /* 现代化的表单布局 */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: all 0.2s ease;
            color: var(--text-main);
            background-color: #fff;
        }

        .form-input:hover {
            border-color: #bbbfc4;
        }

        .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.15);
        }

        /* 大厂规范的极简按钮 */
        .submit-btn {
            width: 100%;
            height: 40px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 12px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .submit-btn:active {
            background-color: #0958d9;
        }

        /* 安全审计提示框 */
        .security-notice {
            margin-top: 24px;
            padding: 12px;
            background-color: #fafafa;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* 页脚安全声明 */
        .internal-footer {
            text-align: center;
            padding: 24px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid rgba(31, 35, 41, 0.05);
        }
    </style>
</head>

<body>
    <header class="internal-header">
        <div class="header-logo">
            DGJ.Service <span class="header-tag">用户：武工，你好！</span>
        </div>
    </header>

    <main class="main-container">
        <div class="login-card">
            <h1 class="card-title">武工，欢迎回来</h1>
            <p class="card-subtitle">SSO或NFC卡片认证</p>
            
            <form name="loginForm" action="./cginfo.txt" method="get">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" name="username" class="form-input" placeholder="请输入工号/邮箱前缀" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" name="password" class="form-input" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="submit-btn">登 录</button>
            </form>

            <div class="security-notice">
                <strong>安全提示：</strong> 本系统仅限集团授权员工内部使用。您的所有操作将被记录，严禁将内部数据向外泄露。
            </div>
        </div>
    </main>

    <footer class="internal-footer">
        <p>© 2026 DGJ.Tech Inc. All Rights Reserved. 集团信息安全部监制</p>
    </footer>
</body>
