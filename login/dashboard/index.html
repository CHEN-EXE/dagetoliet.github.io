<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>大哥国际 - 集团效能与控制中心</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="//unpkg.com/layui@2.13.2/dist/css/layui.css" rel="stylesheet">
  <style>
    /* 大厂内网经典原子设计变量 */
    :root {
      --primary-color: #1677ff;        /* 大厂标准科技蓝 */
      --primary-hover: #4096ff;
      --bg-main: #f5f7fa;             /* 清爽的内网浅灰底色 */
      --text-main: #1f2329;            /* 现代深字色（避开纯黑） */
      --text-secondary: #646a73;       /* 辅助描述文字 */
      --border-color: #dee0e3;         /* 细腻的分割线 */
      --sidebar-width: 240px;
    }

    body {
      background-color: var(--bg-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
    }

    /* 1. 顶栏重构：改用纯白高亮、无缝阴影设计 */
    .layui-layout-admin .layui-header {
      background-color: #ffffff !important;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 1px 4px rgba(0, 21, 41, 0.04);
      height: 56px;
      line-height: 56px;
    }
    .layui-layout-admin .layui-logo {
      width: var(--sidebar-width) !important;
      height: 56px;
      line-height: 56px;
      background-color: #ffffff !important;
      color: var(--text-main) !important;
      font-weight: 600;
      font-size: 16px;
      border-right: 1px solid var(--border-color);
      letter-spacing: 0.5px;
    }
    .layui-header .layui-nav .layui-nav-item a {
      color: var(--text-main) !important;
      font-size: 14px;
    }
    .layui-header .layui-nav .layui-nav-item a:hover {
      color: var(--primary-color) !important;
    }
    .layui-header .layui-nav-child {
      top: 56px !important;
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }
    .layui-layout-right {
      right: 16px !important;
    }

    /* 2. 左侧侧边栏重构：摒弃传统的纯黑，改用深夜蓝或柔和暗色调 */
    .layui-side {
      width: var(--sidebar-width) !important;
      top: 56px !important;
      background-color: #001529 !important; /* 阿里 AntD 经典深夜蓝 */
    }
    .layui-nav-tree {
      width: 100% !important;
      background-color: transparent !important;
    }
    .layui-nav-tree .layui-nav-item a {
      height: 48px;
      line-height: 48px;
      color: rgba(255, 255, 255, 0.7) !important;
      font-size: 14px;
    }
    .layui-nav-tree .layui-nav-item a:hover {
      background-color: rgba(255, 255, 255, 0.05) !important;
      color: #ffffff !important;
    }
    .layui-nav-itemed>a, .layui-nav-tree .layui-nav-title a {
      color: #ffffff !important;
    }
    .layui-nav-tree .layui-nav-bar {
      background-color: var(--primary-color) !important;
      width: 4px !important;
    }
    /* 选中三级/二级子菜单时的高亮状态 */
    .layui-nav-tree .layui-nav-child dd.layui-this, .layui-nav-tree .layui-this>a {
      background-color: var(--primary-color) !important;
      color: #ffffff !important;
    }

    /* 3. 主体内容区域优化 */
    .layui-body {
      left: var(--sidebar-width) !important;
      top: 56px !important;
      bottom: 44px !important;
      padding: 24px !important;
      background-color: var(--bg-main);
    }
    .panel-container {
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
      padding: 24px;
    }
    .panel-header-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-header-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background-color: var(--primary-color);
      border-radius: 2px;
    }

    /* 4. 重构核心：大厂常用的「网格化功能配置卡片」布局 */
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .feature-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    .feature-card:hover {
      border-color: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(22, 119, 255, 0.05);
    }
    .feature-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .feature-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
    }
    .feature-desc {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* 5. 覆盖 Layui 开关颜色为现代品牌蓝 */
    .layui-form-onswitch {
      border-color: var(--primary-color) !important;
      background-color: var(--primary-color) !important;
    }

    /* 6. 页脚优化 */
    .layui-footer {
      left: var(--sidebar-width) !important;
      height: 44px;
      line-height: 44px;
      background-color: #ffffff !important;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      padding: 0 !important;
    }
  </style>
</head>
<body>

  <div class="layui-body">
    <div class="panel-container">
      <div class="panel-header-title">全局功能网关开关</div>
      
      <div class="layui-form" lay-filter="form-demo-skin">
        <div class="feature-grid">
          
          <div class="feature-card">
            <div class="feature-info">
              <span class="feature-name">大哥国际传媒系统</span>

          </div>

          <div class="feature-card">

<script src="//unpkg.com/layui@2.13.2/dist/layui.js"></script>
<script>
  // 恢复并整合原本的用户数据载入逻辑
  const username = localStorage.getItem("userdata") || "Guest_User";
  document.getElementById("userData").innerHTML = `
    <img src="//unpkg.com/outeres@0.0.10/img/layui/icon-v2.png" class="layui-nav-img">
    <span>${username}武工</span>
  `;

  layui.use(['element', 'layer', 'util', 'form'], function(){
    var element = layui.element;
    var layer = layui.layer;
    var util = layui.util;
    var form = layui.form;

    // 重新渲染表单中的开关组件
    form.render('checkbox');
    
    // 头部事件
    util.event('lay-header-event', {
      menuRight: function(){
        layer.open({
          type: 1,
          title: '系统级审计日志',
          content: '<div style="padding: 20px; font-size:13px; color:#646a73;">暂无当前全局网关的高危配置操作变更。</div>',
          area: ['280px', '100%'],
          offset: 'rt',
          anim: 'slideLeft',
          shadeClose: true,
          scrollbar: false
        });
      }
    });
  });
</script>
