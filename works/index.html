<html>

<head>
    <meta charset="utf-8">
    <title>大哥国际厕所集团应聘在线填报系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>
 <style>
        :root {
            --primary-color: #1677ff; /* 大厂常用的科技蓝 */
            --primary-hover: #4096ff;
            --bg-color: #f5f7fa;      /* 干净的内网背景底色 */
            --card-bg: #ffffff;
            --text-main: #1f2329;     /* 字节/飞书风格的深色文本 */
            --text-muted: #646a73;
            --border-color: #dee0e3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 顶部微型导航条，营造内网系统氛围 */
        .internal-header {
            background: #ffffff;
            height: 48px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .header-logo {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #1f2329;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-logo::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
        }

        .header-tag {
            font-size: 11px;
            background: #edf5ff;
            color: var(--primary-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        /* 登录主体容器 */
        .container {
            flex: 1;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(31, 35, 41, 0.04), 0 1px 2px rgba(31, 35, 41, 0.02);
            border: 1px solid rgba(31, 35, 41, 0.08);
        }

        .card-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            text-align: left;
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
            text-align: left;
        }

        /* 现代化的表单布局 */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: all 0.2s ease;
            color: var(--text-main);
            background-color: #fff;
        }

        .form-input:hover {
            border-color: #bbbfc4;
        }

        .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.15);
        }

        /* 大厂规范的极简按钮 */
      button {
            width: 100%;
            height: 40px;
            background-color:#1677ff;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 12px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            background-color: #0958d9;
        }

        /* 安全审计提示框 */
        .security-notice {
            margin-top: 24px;
            padding: 12px;
            background-color: #fafafa;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* 页脚安全声明 */
        .internal-footer {
            text-align: center;
            padding: 24px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid rgba(31, 35, 41, 0.05);
        }
    </style>

<body>
    <style type="text/css">
    </style>







  <header class="internal-header">
        <div class="header-logo">
            大哥国际厕所集团<span class="header-tag">应聘在线填报系统</span>
        </div>
    </header>

    <div class="container">
        <h1 style="text-align: center; margin-top: 20px;">大哥国际厕所集团 2026 年度招聘</h1>

        <div id="otto6"
            style="line-height:1.8; padding:15px; background:#fff; border-radius:12px; margin-bottom:20px; margin-top: 20px;">
            欢迎申请我们的岗位！请认真填写下方信息。<br>
            * 所有标有红色星号(*)的字段为必填项<br>
            * 请确保提供的联系方式正确，方便我们与您联系<br>
            * 提交后我们将在-5个工作日内进行审核<br><br>
            感谢您的关注和支持！
            <br>
            人事部联系：rs@
        </div>

        <form id="recruitmentForm" style="background:#fff; padding:20px; border-radius:12px; margin-bottom:20px;">
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">* 姓名:</label><br>
                <input type="text" id="name" placeholder="请输入您的真实姓名"
                    style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #e0e0e0; border-radius: 4px; box-sizing: border-box;"
                    required />
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">* 年龄:</label><br>
                <input type="number" id="age" placeholder="请输入您的年龄"
                    style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #e0e0e0; border-radius: 4px; box-sizing: border-box;"
                    required />
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">* 性别:</label><br>
                <select id="gender"
                    style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #e0e0e0; border-radius: 4px; box-sizing: border-box;"
                    required>
                    <option value="">请选择</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">* 邮箱:</label><br>
                <input type="email" id="email" placeholder="请输入您的邮箱地址"
                    style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #e0e0e0; border-radius: 4px; box-sizing: border-box;"
                    required />
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">* 电话:</label><br>
                <input type="tel" id="phone" placeholder="请输入您的联系电话"
                    style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #e0e0e0; border-radius: 4px; box-sizing: border-box;"
                    required />
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">* 应聘岗位:</label><br>
                <select id="position"
                    style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #e0e0e0; border-radius: 4px; box-sizing: border-box;"
                    required>
                    <option value="">请选择</option>
                    <option value="产品经理">产品经理</option>
                    <option value="技术工程师">技术工程师</option>
                    <option value="市场营销">市场营销</option>
                    <option value="人力资源">人力资源</option>
                    <option value="销售代表">销售代表</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">* 工作经历:</label><br>
                <textarea id="experience" placeholder="请简述您的工作经历（至少20字）"
                    style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #e0e0e0; border-radius: 4px; box-sizing: border-box; min-height: 80px;"
                    required></textarea>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold;">* 自我介绍:</label><br>
                <textarea id="introduction" placeholder="请简述您为什么想加入我们公司（至少30字）"
                    style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #e0e0e0; border-radius: 4px; box-sizing: border-box; min-height: 100px;"
                    required></textarea>
            </div>

            <div style="text-align: center;">
                <button class="submit-btn" type="button" onclick="submitForm()"
                    style="">提交</button>
            </div>
        </form>

    </div>




    <script>
        function submitForm() {
            // 获取所有表单字段
            const name = document.getElementById('name').value.trim();
            const age = document.getElementById('age').value.trim();
            const gender = document.getElementById('gender').value;
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const position = document.getElementById('position').value;
            const experience = document.getElementById('experience').value.trim();
            const introduction = document.getElementById('introduction').value.trim();

            // 验证所有字段是否填写
            if (!name || !age || !gender || !email || !phone || !position || !experience || !introduction) {
                alert('请填写所有必填项！');
                return;
            }

            // 验证邮箱格式
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('请输入有效的邮箱地址！');
                return;
            }

            // 验证电话格式（简单验证）
            const phoneRegex = /^1[3-9]\d{9}$|^0\d{2,3}-?\d{7,8}$/;
            if (!phoneRegex.test(phone)) {
                alert('请输入有效的电话号码！');
                return;
            }

            // 验证工作经历长度
            if (experience.length < 20) {
                alert('工作经历至少需要20个字！');
                return;
            }

            // 验证自我介绍长度
            if (introduction.length < 30) {
                alert('自我介绍至少需要30个字！');
                return;
            }

            // 所有验证通过，显示完成对话框
            alert('填写完成！');

            // 可以在这里添加后续操作，比如清空表单
            // document.getElementById('recruitmentForm').reset();
        }
    </script>
</body>

</html>
